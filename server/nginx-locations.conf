# Location snippets for an existing HTTPS server block with a real certificate.
# Keep the Codex Responses provider private; never expose /v1/ publicly.
location /v1/ { return 404; }

# MCP and GPT Actions share the same loopback bridge and use distinct Bearer keys.
location ~ ^/(mode/mcp|mcp|codex-x-app/mcp|app/mcp|healthz|status|projects|tasks|backend)(/|$) {
    proxy_pass http://127.0.0.1:8240;
    proxy_http_version 1.1;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header MCP-Protocol-Version $http_mcp_protocol_version;
    proxy_set_header Mcp-Method $http_mcp_method;
    proxy_set_header Mcp-Name $http_mcp_name;
    proxy_buffering off;
    proxy_read_timeout 40s;
    client_max_body_size 1m;
    access_log off;
}

location / { return 404; }
